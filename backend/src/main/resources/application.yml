spring:
  application:
    name: nektis-invest-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nektis_invest}
    username: ${SPRING_DATASOURCE_USERNAME:nektis}
    password: ${SPRING_DATASOURCE_PASSWORD:nektis}
    hikari:
      # Dimensionado para a Neon, que suspende o compute quando fica ocioso e
      # derruba as conexões abertas.
      #   minimum-idle: 0  -> o pool esvazia junto, em vez de segurar conexões mortas
      #   max-lifetime    -> abaixo do tempo de suspensão, para reciclar antes dele
      #   connection-timeout -> folga para o cold start do compute (~1-3 s)
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 280000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  # A Square Cloud injeta PORT (80). Local continua 8080.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.thomas.nektisinvest: INFO

nektis:
  # Estamos atrás de um proxy reverso de confiança que sobrescreve os headers
  # X-Forwarded-*? Governa duas coisas que dependem da mesma premissa:
  #   - de onde o rate limit tira o IP do cliente;
  #   - se o ForwardedHeaderFilter reconstrói o esquema/host públicos, sem o que
  #     o Spring não reconhece as requisições do próprio site como mesma origem.
  confiar-proxy: ${CONFIAR_PROXY:false}
  # Origens liberadas no frame-src do CSP, para o iframe do vídeo de
  # apresentação. Ajuste se o vídeo sair do YouTube/Vimeo.
  csp-frame-src: ${CSP_FRAME_SRC:https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com}
  url-frontend: ${URL_FRONTEND:http://localhost:3000}
  url-publica: ${URL_PUBLICA_API:http://localhost:8080}
  limite-taxa:
    capacidade: 10
    capacidade-leitura: 300
    janela: PT1M
  pagamentos:
    gateway: ${GATEWAY_PAGAMENTO:stripe}
    stripe:
      chave-secreta: ${STRIPE_SECRET_KEY:}
      id-preco: ${STRIPE_PRICE_ID:}
      segredo-webhook: ${STRIPE_WEBHOOK_SECRET:}
  email:
    provedor: ${PROVEDOR_EMAIL:resend}
    remetente: ${EMAIL_REMETENTE:Nektis Invest <invest@nektis.tech>}
    chave-resend: ${RESEND_API_KEY:}
  links-acesso:
    noticias: ${WHATSAPP_NOTICIAS_URL:}
    networking: ${WHATSAPP_NETWORKING_URL:}

---
spring:
  config:
    activate:
      on-profile: dev

nektis:
  pagamentos:
    gateway: falso
  email:
    provedor: log

logging:
  level:
    com.thomas.nektisinvest: DEBUG
